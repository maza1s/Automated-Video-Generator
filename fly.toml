# fly.toml app configuration file generated for makslotajs on 2026-09-26T03:50:56Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'makslotajs'
primary_region = 'fra'

[deploy]
  release_command_timeout = '1h'
  strategy = 'rolling'
  wait_timeout = '1h'

[http_service]
  auto_start_machines = true
  auto_stop_machines = true
  force_https = true
  internal_port = 8081
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '1gb'
  memory_mb = 32768
